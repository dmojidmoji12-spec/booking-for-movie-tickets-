<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Booking</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #111827, #4c0519);
            color: #111827;
        }

        .movie {
            width: min(92%, 400px);
            background: white;
            padding: 28px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,.35);
        }

        .movie h1 { margin-top: 0; }
        .movie h2 { color: #e50914; }

        select, button {
            width: 100%;
            padding: 13px;
            margin-top: 12px;
            border-radius: 10px;
            font-size: 16px;
        }

        select {
            border: 1px solid #ccc;
            background: white;
        }

        button {
            border: 0;
            background: #e50914;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: transform .2s, opacity .2s;
        }

        button:hover {
            transform: translateY(-2px);
            opacity: .9;
        }

        #success {
            display: none;
            margin-top: 20px;
            padding: 18px;
            border-radius: 14px;
            background: #ecfdf5;
            color: #065f46;
            animation: pop .35s ease;
        }

        #error {
            color: #b91c1c;
            min-height: 20px;
            margin: 12px 0 0;
        }

        @keyframes pop {
            from { transform: scale(.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

<div class="movie">
    <h1>🎬 Movie Booking</h1>
    <h2>Avengers</h2>
    <p>Choose your seat</p>

    <select id="seat">
        <option value="">Select Seat</option>
        <option value="A1">A1</option>
        <option value="A2">A2</option>
        <option value="A3">A3</option>
        <option value="B1">B1</option>
        <option value="B2">B2</option>
    </select>

    <p id="error"></p>

    <button onclick="bookTicket()">Book Ticket</button>

    <div id="success">
        <h2>✅ Booking Successful!</h2>
        <p id="ticket"></p>
        <button onclick="closeWindow()">Close</button>
    </div>
</div>

<script>
function bookTicket() {
    const seat = document.getElementById("seat").value;
    const error = document.getElementById("error");

    if (seat === "") {
        error.textContent = "Please select a seat!";
        return;
    }

    error.textContent = "";

    document.getElementById("success").style.display = "block";

    document.getElementById("ticket").innerHTML =
        "Your seat <b>" + seat + "</b> has been booked successfully.";
}

function closeWindow() {
    window.close();

    // Browsers normally block closing a tab opened manually.
    // If closing is blocked, return to the home page.
    setTimeout(function () {
        window.location.href = "index.html";
    }, 500);
}
</script>

</body>
</html>
